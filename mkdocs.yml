site_name: Chakshu
site_description: Self-hosted pull request reviews for GitHub teams
site_url: https://chakshu.havelin.in/docs/
repo_url: https://github.com/havelin-labs/chakshu
repo_name: havelin-labs/chakshu
edit_uri: https://github.com/havelin-labs/chakshu-docs/edit/main/docs/
copyright: Copyright &copy; Havelin Labs. Apache-2.0.

theme:
  name: material
  # Brand colors live in docs/stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Get started:
      - Install with Docker Compose: getting-started/install.md
      - Connect GitHub: getting-started/connect-github.md
      - Set up GitHub Actions: getting-started/github-actions.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Use Chakshu:
      - Calling Chakshu: concepts/calling-chakshu.md
      - Reviewers: concepts/reviewers.md
      - Replies: concepts/replies.md
      - Connectors: concepts/connectors.md
      - How a review runs: concepts/how-a-review-runs.md
  - Analytics:
      - Analytics: concepts/analytics.md
      - Insights: concepts/insights.md
  - Reference:
      - Configuration: reference/configuration.md
      - Deterministic IDs: reference/ids.md
  - Project:
      - Architecture: project/architecture.md
      - Roadmap: project/roadmap.md
      - Contributing: project/contributing.md
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
